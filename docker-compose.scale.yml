services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
  agent:
    build: .
    environment:
      PORT: 8000
      AGENT_API_KEY: ${AGENT_API_KEY:?Set AGENT_API_KEY in .env}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "0:8000"
    depends_on:
      - redis
volumes:
  redis-data:
